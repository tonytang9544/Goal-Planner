[package]
name = "jira-tv-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
argon2 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["chrono", "migrate", "runtime-tokio-rustls", "sqlite", "uuid"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }
